# Render Blueprint: một web service (Spring Boot phục vụ cả frontend) + PostgreSQL.
services:
  - type: web
    name: mystudy
    runtime: docker
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_ORIGIN            # Địa chỉ HTTPS công khai, ví dụ https://mystudy.onrender.com
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mystudy-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: mystudy-db
    plan: basic-256mb
    postgresMajorVersion: "16"
